name: Build wdi-helper

on:
  push:
    paths:
      - 'wdi-helper/**'
      - '.github/workflows/build-wdi-helper.yml'
  pull_request:
    paths:
      - 'wdi-helper/**'
      - '.github/workflows/build-wdi-helper.yml'
  workflow_dispatch:
  workflow_call:

env:
  # Pinned libwdi commit (matches upstream master tip used for VS2022 CI)
  LIBWDI_REF: 30df0c0e051b0132c4b9ebed8c054bc8eb3aaaec
  WDK_URL: https://go.microsoft.com/fwlink/p/?LinkID=253170
  LIBUSB0_URL: https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.0/libusb-win32-bin-1.4.0.0.zip
  LIBUSBK_URL: https://github.com/mcuee/libusbk/releases/download/V3.1.0.0/libusbK-3.1.0.0-bin.7z
  BUILD_MACROS: '"WDK_DIR=\"../wdk/Windows Kits/8.0\";LIBUSB0_DIR=\"../libusb0\";LIBUSBK_DIR=\"../libusbk/bin\""'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout libwdi
        uses: actions/checkout@v5
        with:
          repository: pbatard/libwdi
          # Keep in sync with env.LIBWDI_REF above
          ref: 30df0c0e051b0132c4b9ebed8c054bc8eb3aaaec
          path: deps/libwdi

      - name: Download support files
        shell: cmd
        working-directory: deps/libwdi
        run: |
          curl -L ${{ env.WDK_URL }} -o wdk-redist.msi
          curl -L ${{ env.LIBUSB0_URL }} -o libusb0-redist.zip
          curl -L ${{ env.LIBUSBK_URL }} -o libusbk-redist.7z
          msiexec /a wdk-redist.msi /qn TARGETDIR=%CD%\wdk
          7z x libusb0-redist.zip
          7z x libusbk-redist.7z
          del *.zip
          del *.7z
          del *.msi
          move libusb-win32* libusb0
          move libusbK* libusbk

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Prepare libwdi for x64-only host build
        shell: pwsh
        working-directory: deps/libwdi
        run: |
          # wdi-helper is amd64-only. Disable Win32/ARM embedding so we do not need
          # installer_x86 / installer_arm64 (and their toolchains) on the runner.
          $cfg = Get-Content msvc\config.h -Raw
          $cfg = $cfg -replace '#define OPT_M32','// #define OPT_M32'
          $cfg = $cfg -replace '#define OPT_ARM','// #define OPT_ARM'
          Set-Content msvc\config.h $cfg -NoNewline

          $proj = 'libwdi\.msvc\libwdi_static.vcxproj'
          $xml = Get-Content $proj -Raw
          foreach ($name in @('installer_arm64','installer_x86')) {
            $xml = [regex]::Replace(
              $xml,
              "\s*<ProjectReference Include=`"$name\.vcxproj`">[\s\S]*?</ProjectReference>",
              '')
          }
          Set-Content $proj $xml -NoNewline

      - name: Build libwdi static library (x64)
        shell: cmd
        working-directory: deps/libwdi
        # Build only the pieces needed for an amd64 libwdi.lib:
        #   embedder (Win32 helper exe) → installer_x64 → libwdi_static
        # Note: embedder's ProjectReference rebuilds detect_64build as Win32 and
        # writes NO_BUILD64; that is fine once OPT_M32 is disabled in config.h.
        run: |
          set SOLUTIONDIR=%CD%\
          msbuild libwdi\.msvc\embedder.vcxproj /m /p:Configuration=Release,Platform=Win32,SolutionDir=%SOLUTIONDIR%,BuildMacros=${{ env.BUILD_MACROS }}
          if errorlevel 1 exit /b 1
          msbuild libwdi\.msvc\installer_x64.vcxproj /m /p:Configuration=Release,Platform=x64,SolutionDir=%SOLUTIONDIR%,BuildMacros=${{ env.BUILD_MACROS }}
          if errorlevel 1 exit /b 1
          if not exist x64\Release\helper\installer_x64.exe (
            echo installer_x64.exe missing
            exit /b 1
          )
          msbuild libwdi\.msvc\libwdi_static.vcxproj /m /p:Configuration=Release,Platform=x64,SolutionDir=%SOLUTIONDIR%,BuildMacros=${{ env.BUILD_MACROS }},BuildProjectReferences=false
          if errorlevel 1 exit /b 1
          if not exist x64\Release\lib\libwdi.lib (
            echo libwdi.lib not found at x64\Release\lib\libwdi.lib
            dir /s /b *.lib
            exit /b 1
          )

      - name: Build wdi-helper.exe
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvarsall.bat" x64
          )
          cl /nologo /O2 /MT /W3 /I deps\libwdi\libwdi ^
            wdi-helper\wdi-helper.c ^
            /Fe:wdi-helper\wdi-helper.exe ^
            /link /SUBSYSTEM:CONSOLE ^
            deps\libwdi\x64\Release\lib\libwdi.lib ^
            setupapi.lib newdev.lib ntdll.lib ole32.lib user32.lib advapi32.lib ^
            /MANIFEST:EMBED /MANIFESTINPUT:wdi-helper\wdi-helper.exe.manifest

      - name: Smoke test
        shell: cmd
        run: |
          wdi-helper\wdi-helper.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: wdi-helper
          path: wdi-helper/wdi-helper.exe
          if-no-files-found: error
